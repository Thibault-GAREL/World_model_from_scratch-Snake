<svg viewBox="0 0 1240 780" xmlns="http://www.w3.org/2000/svg" width="1240" height="780">
  <title>Action-Conditioned JEPA - Snake World Model</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>

    <filter id="shadow-sm" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-md" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000020"/>
    </filter>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/></marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6366F1"/></marker>
    <marker id="arrow-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0EA5E9"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#F43F5E"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#06B6D4"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/></marker>
  </defs>

  <rect width="1240" height="780" fill="#FFFFFF"/>
  <rect width="1240" height="780" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <g>
    <text x="40" y="46" font-size="19" font-weight="700" fill="#111827">Action-Conditioned JEPA  ·  Snake World Model</text>
    <text x="40" y="68" font-size="12.5" font-weight="400" fill="#6B7280">Predicts representations (not pixels)  ·  acts by latent-space MPC  ·  no learned policy</text>
    <line x1="40" y1="80" x2="330" y2="80" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ===================== ARROWS (drawn first, under blocks) ===================== -->
  <!-- Main flow (indigo) -->
  <line x1="200" y1="365" x2="258" y2="365" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
  <line x1="420" y1="365" x2="478" y2="365" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
  <line x1="576" y1="365" x2="634" y2="365" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <line x1="806" y1="365" x2="864" y2="365" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <!-- action -> predictor (up) -->
  <line x1="721" y1="460" x2="721" y2="412" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-amber)"/>

  <!-- Target flow (sky) -->
  <line x1="420" y1="156" x2="478" y2="156" stroke="#0EA5E9" stroke-width="1.8" marker-end="url(#arrow-sky)"/>
  <line x1="670" y1="156" x2="728" y2="156" stroke="#0EA5E9" stroke-width="1.8" marker-end="url(#arrow-sky)"/>
  <line x1="826" y1="156" x2="864" y2="156" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <!-- predicted latent -> loss (up) -->
  <line x1="921" y1="333" x2="921" y2="206" stroke="#F43F5E" stroke-width="1.8" marker-end="url(#arrow-rose)"/>
  <text x="930" y="262" font-size="10" font-weight="500" fill="#9F1239">latent target</text>

  <!-- EMA update (dashed) encoder -> target encoder -->
  <path d="M 340,318 L 340,250 Q 340,230 360,230 L 555,230 Q 575,230 575,210 L 575,198"
        fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5,4" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
  <g><rect x="392" y="219" width="96" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
     <text x="440" y="233" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">EMA update</text></g>

  <!-- Control flow -->
  <!-- s_t -> reward / done heads -->
  <line x1="520" y1="397" x2="520" y2="554" stroke="#10B981" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
  <path d="M 540,397 L 540,524 Q 540,540 558,540 L 673,540 Q 691,540 691,554"
        fill="none" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow-emerald)"/>
  <!-- predicted latent -> planner (down) -->
  <line x1="950" y1="397" x2="950" y2="550" stroke="#06B6D4" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <text x="958" y="474" font-size="10" font-weight="500" fill="#155E75">imagined  ŝₜ₊₁</text>
  <!-- done -> planner -->
  <line x1="766" y1="598" x2="838" y2="598" stroke="#06B6D4" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <!-- reward -> planner (under-route) -->
  <path d="M 515,640 L 515,666 Q 515,684 535,684 L 928,684 Q 948,684 948,666 L 948,646"
        fill="none" stroke="#06B6D4" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <!-- planner -> action (feedback, dashed) -->
  <path d="M 880,550 L 880,508 Q 880,488 860,488 L 798,488"
        fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6,4" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <text x="802" y="466" font-size="10" font-weight="600" fill="#92400E">selected action</text>

  <!-- ===================== BLOCKS ===================== -->
  <!-- MIDDLE LANE: main path -->
  <!-- o_t -->
  <g>
    <rect x="40" y="320" width="160" height="90" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="120" y="360" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">Observation  oₜ</text>
    <text x="120" y="380" font-size="11" font-weight="400" fill="#B45309" text-anchor="middle">grid  3 × 8 × 16</text>
  </g>
  <!-- Encoder -->
  <g>
    <rect x="260" y="320" width="160" height="90" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="260" y="320" width="4" height="90" rx="2" fill="#6366F1"/>
    <text x="340" y="360" font-size="13" font-weight="600" fill="#3730A3" text-anchor="middle">Encoder</text>
    <text x="340" y="380" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="middle">small CNN</text>
  </g>
  <!-- s_t -->
  <g>
    <rect x="480" y="333" width="96" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="528" y="364" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">sₜ</text>
    <text x="528" y="382" font-size="10" font-weight="400" fill="#64748B" text-anchor="middle">latent state</text>
  </g>
  <!-- Predictor -->
  <g>
    <rect x="636" y="320" width="170" height="90" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="636" y="320" width="4" height="90" rx="2" fill="#8B5CF6"/>
    <text x="721" y="358" font-size="13" font-weight="600" fill="#6D28D9" text-anchor="middle">Predictor</text>
    <text x="721" y="378" font-size="11" font-weight="400" fill="#7C3AED" text-anchor="middle">MLP  ·  [ sₜ , aₜ ]</text>
    <text x="721" y="396" font-size="9.5" font-weight="500" fill="#9CA3AF" text-anchor="middle">latent dynamics</text>
  </g>
  <!-- predicted latent -->
  <g>
    <rect x="866" y="333" width="110" height="64" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#shadow-sm)"/>
    <text x="921" y="364" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="middle">ŝₜ₊₁</text>
    <text x="921" y="382" font-size="10" font-weight="400" fill="#7C3AED" text-anchor="middle">predicted</text>
  </g>

  <!-- TOP LANE: target path -->
  <!-- o_{t+1} -->
  <g>
    <rect x="260" y="116" width="160" height="80" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="340" y="151" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">Observation  oₜ₊₁</text>
    <text x="340" y="171" font-size="11" font-weight="400" fill="#B45309" text-anchor="middle">next grid</text>
  </g>
  <!-- Target Encoder -->
  <g>
    <rect x="480" y="116" width="190" height="80" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="480" y="116" width="4" height="80" rx="2" fill="#0EA5E9"/>
    <text x="575" y="151" font-size="13" font-weight="600" fill="#075985" text-anchor="middle">Target Encoder</text>
    <text x="575" y="171" font-size="11" font-weight="400" fill="#0369A1" text-anchor="middle">EMA copy  ·  stop-grad</text>
  </g>
  <!-- s_{t+1} -->
  <g>
    <rect x="730" y="124" width="96" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="778" y="155" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">sₜ₊₁</text>
    <text x="778" y="173" font-size="10" font-weight="400" fill="#64748B" text-anchor="middle">target</text>
  </g>
  <!-- Loss -->
  <g>
    <rect x="866" y="112" width="190" height="94" rx="12" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow-md)"/>
    <text x="961" y="142" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">JEPA Loss</text>
    <text x="961" y="164" font-size="11" font-weight="500" fill="#BE123C" text-anchor="middle">‖ ŝₜ₊₁ − sg(sₜ₊₁) ‖²</text>
    <text x="961" y="184" font-size="11" font-weight="500" fill="#BE123C" text-anchor="middle">+  λ · VICReg</text>
    <text x="961" y="200" font-size="9" font-weight="500" fill="#FB7185" text-anchor="middle">anti-collapse</text>
  </g>

  <!-- ACTION -->
  <g>
    <rect x="646" y="460" width="150" height="54" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="721" y="484" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">Action  aₜ</text>
    <text x="721" y="502" font-size="11" font-weight="500" fill="#B45309" text-anchor="middle">↑   →   ↓   ←</text>
  </g>

  <!-- BOTTOM LANE: control -->
  <!-- Reward head -->
  <g>
    <rect x="440" y="556" width="150" height="84" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="440" y="556" width="4" height="84" rx="2" fill="#10B981"/>
    <text x="515" y="588" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">Reward Head</text>
    <text x="515" y="607" font-size="11" font-weight="400" fill="#047857" text-anchor="middle">r̂   ·   MSE</text>
    <text x="515" y="625" font-size="9" font-weight="400" fill="#6EE7B7" text-anchor="middle">from sₜ , aₜ</text>
  </g>
  <!-- Done head -->
  <g>
    <rect x="616" y="556" width="150" height="84" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="616" y="556" width="4" height="84" rx="2" fill="#10B981"/>
    <text x="691" y="588" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">Done Head</text>
    <text x="691" y="607" font-size="11" font-weight="400" fill="#047857" text-anchor="middle">p(death)  ·  BCE</text>
    <text x="691" y="625" font-size="9" font-weight="400" fill="#6EE7B7" text-anchor="middle">from sₜ , aₜ</text>
  </g>
  <!-- MPC Planner -->
  <g>
    <rect x="840" y="550" width="220" height="94" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5" filter="url(#shadow-md)"/>
    <rect x="840" y="550" width="4" height="94" rx="2" fill="#06B6D4"/>
    <text x="950" y="582" font-size="14" font-weight="700" fill="#155E75" text-anchor="middle">MPC Planner</text>
    <text x="950" y="602" font-size="11" font-weight="400" fill="#0E7490" text-anchor="middle">argmax over imagined rollouts</text>
    <g><rect x="888" y="614" width="124" height="20" rx="10" fill="#CFFAFE"/>
       <text x="950" y="628" font-size="10" font-weight="600" fill="#155E75" text-anchor="middle">no learned policy</text></g>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(40,556)">
    <rect width="212" height="196" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="16" y="26" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">LEGEND</text>
    <rect x="16" y="38" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#F59E0B"/><text x="40" y="50" font-size="10.5" fill="#1E293B">Input / Action</text>
    <rect x="16" y="60" width="14" height="14" rx="3" fill="#EEF2FF" stroke="#6366F1"/><text x="40" y="72" font-size="10.5" fill="#1E293B">Encoder (online)</text>
    <rect x="16" y="82" width="14" height="14" rx="3" fill="#F0F9FF" stroke="#0EA5E9"/><text x="40" y="94" font-size="10.5" fill="#1E293B">Target encoder (EMA)</text>
    <rect x="16" y="104" width="14" height="14" rx="3" fill="#F5F3FF" stroke="#8B5CF6"/><text x="40" y="116" font-size="10.5" fill="#1E293B">Predictor / latent</text>
    <rect x="16" y="126" width="14" height="14" rx="3" fill="#FFF1F2" stroke="#F43F5E"/><text x="40" y="138" font-size="10.5" fill="#1E293B">JEPA loss + VICReg</text>
    <rect x="16" y="148" width="14" height="14" rx="3" fill="#ECFDF5" stroke="#10B981"/><text x="40" y="160" font-size="10.5" fill="#1E293B">Reward / Done heads</text>
    <rect x="16" y="170" width="14" height="14" rx="3" fill="#ECFEFF" stroke="#06B6D4"/><text x="40" y="182" font-size="10.5" fill="#1E293B">MPC control loop</text>
  </g>
</svg>
