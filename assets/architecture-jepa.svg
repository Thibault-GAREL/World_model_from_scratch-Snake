<svg viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg" width="1080" height="600">
  <title>Action-Conditioned JEPA - Snake World Model (training + control)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
      .n { font-size: 12px; font-weight: 600; }
      .s { font-size: 9.5px; font-weight: 400; }
      .lab { font-size: 10px; font-weight: 600; }
    </style>
    <filter id="sh" x="-6%" y="-6%" width="115%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.5"/></pattern>
    <marker id="a"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/></marker>
    <marker id="av" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8B5CF6"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#F43F5E"/></marker>
    <marker id="ae" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#10B981"/></marker>
    <marker id="as" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#0EA5E9"/></marker>
    <marker id="am" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#F59E0B"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#06B6D4"/></marker>
  </defs>
  <rect width="1080" height="600" fill="#FFFFFF"/>
  <rect width="1080" height="600" fill="url(#grid)" opacity="0.5"/>

  <text x="40" y="40" font-size="18" font-weight="700" fill="#111827">Action-Conditioned JEPA · Snake World Model</text>
  <text x="40" y="60" font-size="12" fill="#6B7280">predicts representations (not pixels) · acts by latent-space MPC · no learned policy</text>

  <!-- ============ PANEL A : TRAINING ============ -->
  <rect x="34" y="80" width="1012" height="352" rx="14" fill="#6366F108" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="52" y="70" width="200" height="22" rx="11" fill="#1E293B"/><text x="152" y="85" font-size="11" font-weight="600" fill="#FFF" text-anchor="middle">TRAINING — world model</text>

  <!-- straight main-flow arrows -->
  <line x1="160" y1="290" x2="194" y2="290" stroke="#64748B" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="324" y1="290" x2="358" y2="290" stroke="#64748B" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="446" y1="290" x2="484" y2="290" stroke="#8B5CF6" stroke-width="1.7" marker-end="url(#av)"/>
  <line x1="626" y1="290" x2="662" y2="290" stroke="#8B5CF6" stroke-width="1.7" marker-end="url(#av)"/>
  <line x1="768" y1="290" x2="810" y2="290" stroke="#F43F5E" stroke-width="1.7" marker-end="url(#ar)"/>
  <!-- target row arrows -->
  <line x1="324" y1="168" x2="358" y2="168" stroke="#0EA5E9" stroke-width="1.7" marker-end="url(#as)"/>
  <line x1="520" y1="168" x2="554" y2="168" stroke="#0EA5E9" stroke-width="1.7" marker-end="url(#as)"/>
  <!-- s_{t+1} -> loss (top of loss) -->
  <path d="M 642,168 L 858,168 Q 880,168 880,188 L 880,248" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="5,3" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="700" y="160" class="lab" fill="#0369A1">target (stop-grad)</text>
  <!-- action -> predictor (up) -->
  <line x1="556" y1="356" x2="556" y2="322" stroke="#F59E0B" stroke-width="1.7" marker-end="url(#am)"/>
  <!-- EMA encoder -> target encoder -->
  <path d="M 260,260 L 260,222 Q 260,210 280,210 L 420,210 Q 440,210 440,198 L 440,196" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="296" y="200" width="108" height="19" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="350" y="213" class="lab" fill="#475569" text-anchor="middle">EMA  τ = 0.99</text>
  <!-- s_t -> heads -->
  <path d="M 396,315 L 396,344 Q 396,356 378,356 L 326,356" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ae)"/>
  <path d="M 410,315 L 410,338 Q 410,350 392,350 L 224,350 Q 206,350 206,358" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ae)"/>

  <!-- target row blocks -->
  <g class="n">
    <rect x="196" y="141" width="128" height="54" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.4" filter="url(#sh)"/><text x="260" y="166" fill="#92400E" text-anchor="middle">Observation oₜ₊₁</text><text x="260" y="182" class="s" fill="#B45309" text-anchor="middle">next grid</text>
    <rect x="360" y="141" width="160" height="54" rx="9" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.4" filter="url(#sh)"/><rect x="360" y="141" width="4" height="54" rx="2" fill="#0EA5E9"/><text x="442" y="164" fill="#075985" text-anchor="middle">Target Encoder</text><text x="442" y="181" class="s" fill="#0369A1" text-anchor="middle">EMA copy · stop-grad</text>
    <rect x="556" y="144" width="86" height="48" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" filter="url(#sh)"/><text x="599" y="166" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">sₜ₊₁</text><text x="599" y="182" class="s" fill="#64748B" text-anchor="middle">target</text>
  </g>

  <!-- main row blocks -->
  <g class="n">
    <rect x="56" y="260" width="104" height="60" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.4" filter="url(#sh)"/><text x="108" y="286" fill="#92400E" text-anchor="middle">Obs oₜ</text><text x="108" y="302" class="s" fill="#B45309" text-anchor="middle">3×8×16</text>
    <rect x="196" y="260" width="128" height="60" rx="9" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.4" filter="url(#sh)"/><rect x="196" y="260" width="4" height="60" rx="2" fill="#6366F1"/><text x="260" y="286" fill="#3730A3" text-anchor="middle">Encoder (CNN)</text><text x="260" y="302" class="s" fill="#4F46E5" text-anchor="middle">online</text>
    <rect x="360" y="265" width="86" height="50" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.7" filter="url(#sh)"/><text x="403" y="287" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">sₜ</text><text x="403" y="303" class="s" fill="#64748B" text-anchor="middle">latent (128)</text>
    <rect x="486" y="260" width="140" height="60" rx="9" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.4" filter="url(#sh)"/><rect x="486" y="260" width="4" height="60" rx="2" fill="#8B5CF6"/><text x="556" y="286" fill="#6D28D9" text-anchor="middle">Predictor</text><text x="556" y="302" class="s" fill="#7C3AED" text-anchor="middle">ŝₜ₊₁ = sₜ + Δ</text>
    <rect x="662" y="265" width="106" height="50" rx="9" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#sh)"/><text x="715" y="287" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="middle">ŝₜ₊₁</text><text x="715" y="303" class="s" fill="#7C3AED" text-anchor="middle">predicted</text>
    <rect x="812" y="248" width="180" height="86" rx="11" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" filter="url(#sh)"/><text x="902" y="274" font-size="12.5" font-weight="700" fill="#9F1239" text-anchor="middle">JEPA loss</text><text x="902" y="294" class="s" fill="#BE123C" text-anchor="middle">‖ŝₜ₊₁ − sg(sₜ₊₁)‖²</text><text x="902" y="310" class="s" fill="#BE123C" text-anchor="middle">+ VICReg (anti-collapse)</text><text x="902" y="326" class="s" fill="#BE123C" text-anchor="middle">+ reward MSE + done BCE</text>
  </g>

  <!-- action + heads -->
  <g class="n">
    <rect x="486" y="356" width="140" height="44" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.4" filter="url(#sh)"/><text x="556" y="374" fill="#92400E" text-anchor="middle">Action aₜ</text><text x="556" y="390" class="s" fill="#B45309" text-anchor="middle">one-hot (4)</text>
    <rect x="152" y="358" width="108" height="52" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4" filter="url(#sh)"/><text x="206" y="380" fill="#065F46" text-anchor="middle">Reward head</text><text x="206" y="396" class="s" fill="#047857" text-anchor="middle">(sₜ,aₜ) → r̂  · MSE</text>
    <rect x="272" y="358" width="108" height="52" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4" filter="url(#sh)"/><text x="326" y="380" fill="#065F46" text-anchor="middle">Done head</text><text x="326" y="396" class="s" fill="#047857" text-anchor="middle">(sₜ,aₜ) → p(death)</text>
  </g>

  <!-- ============ PANEL B : CONTROL ============ -->
  <rect x="34" y="448" width="1012" height="132" rx="14" fill="#06B6D40A" stroke="#06B6D455" stroke-width="1.4"/>
  <rect x="52" y="438" width="270" height="22" rx="11" fill="#06B6D4"/><text x="187" y="453" font-size="11" font-weight="600" fill="#FFF" text-anchor="middle">CONTROL — MPC (no learned policy)</text>
  <text x="610" y="453" class="s" fill="#0E7490">reuses the encoder / predictor / heads trained above — no extra network</text>

  <g class="n">
    <rect x="60" y="496" width="150" height="50" rx="9" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4" filter="url(#sh)"/><text x="135" y="518" fill="#155E75" text-anchor="middle">encode obs → sₜ</text><text x="135" y="534" class="s" fill="#0E7490" text-anchor="middle">real observation</text>
    <rect x="258" y="496" width="200" height="50" rx="9" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4" filter="url(#sh)"/><text x="358" y="518" fill="#155E75" text-anchor="middle">imagine 4ᴴ rollouts</text><text x="358" y="534" class="s" fill="#0E7490" text-anchor="middle">Predictor, in latent space</text>
    <rect x="506" y="496" width="200" height="50" rx="9" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4" filter="url(#sh)"/><text x="606" y="518" fill="#155E75" text-anchor="middle">score each future</text><text x="606" y="534" class="s" fill="#0E7490" text-anchor="middle">Σ survival-weighted r̂</text>
    <rect x="754" y="496" width="190" height="50" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#sh)"/><text x="849" y="518" fill="#065F46" text-anchor="middle">argmax → play 1st</text><text x="849" y="534" class="s" fill="#047857" text-anchor="middle">then re-plan</text>
  </g>
  <line x1="210" y1="521" x2="256" y2="521" stroke="#06B6D4" stroke-width="1.7" marker-end="url(#ac)"/>
  <line x1="458" y1="521" x2="504" y2="521" stroke="#06B6D4" stroke-width="1.7" marker-end="url(#ac)"/>
  <line x1="706" y1="521" x2="752" y2="521" stroke="#06B6D4" stroke-width="1.7" marker-end="url(#ac)"/>
  <!-- receding-horizon loop -->
  <path d="M 849,546 L 849,564 Q 849,572 829,572 L 155,572 Q 135,572 135,564 L 135,546" fill="none" stroke="#F59E0B" stroke-width="1.7" stroke-dasharray="6,4" stroke-linecap="round" marker-end="url(#am)"/>
  <text x="492" y="568" class="lab" fill="#92400E" text-anchor="middle">receding horizon: execute one step, observe, re-encode, re-plan</text>
</svg>
