<svg viewBox="0 0 1160 500" xmlns="http://www.w3.org/2000/svg" width="1160" height="500">
  <title>The collapse problem and the three guards (stop-grad, EMA, VICReg)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    <filter id="sh" x="-6%" y="-6%" width="115%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/></filter>
  </defs>
  <rect width="1160" height="500" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="19" font-weight="700" fill="#111827">The collapse trap - and the three guards that prevent it</text>
  <text x="40" y="66" font-size="12.5" fill="#6B7280">a JEPA can cheat by making the encoder output a constant: latent loss = 0, but the model is useless</text>

  <!-- LEFT: collapsed vs healthy clouds -->
  <text x="60" y="106" font-size="13" font-weight="700" fill="#9F1239">❌ Collapsed encoder</text>
  <rect x="60" y="116" width="200" height="150" rx="12" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="160" cy="191" r="9" fill="#F43F5E"/>
  <circle cx="160" cy="191" r="22" fill="none" stroke="#F43F5E" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="160" y="240" font-size="10.5" fill="#9F1239" text-anchor="middle">all states → same point</text>
  <text x="160" y="255" font-size="10.5" fill="#9F1239" text-anchor="middle">std → 0   (no information)</text>

  <text x="300" y="106" font-size="13" font-weight="700" fill="#065F46">✅ Healthy encoder</text>
  <rect x="300" y="116" width="200" height="150" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#sh)"/>
  <g fill="#10B981">
    <circle cx="340" cy="150" r="6"/><circle cx="400" cy="135" r="6"/><circle cx="455" cy="165" r="6"/>
    <circle cx="330" cy="210" r="6"/><circle cx="385" cy="235" r="6"/><circle cx="445" cy="220" r="6"/>
    <circle cx="370" cy="185" r="6"/><circle cx="420" cy="195" r="6"/><circle cx="465" cy="125" r="6"/>
  </g>
  <text x="400" y="255" font-size="10.5" fill="#065F46" text-anchor="middle">spread out, std ≈ 1 (rich)</text>

  <text x="60" y="300" font-size="11.5" fill="#475569">Our monitor (`emb_std`) measures exactly this - it must stay near 1, never fall to 0.</text>
  <text x="60" y="320" font-size="11.5" fill="#475569">Measured: emb_std ≈ 1.0, effective rank ≈ 83 / 128 → no collapse.</text>

  <!-- RIGHT: 3 guards -->
  <text x="560" y="106" font-size="13" font-weight="700" fill="#1E293B">The three guards (all required)</text>

  <g>
    <rect x="560" y="120" width="560" height="76" rx="11" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="560" y="120" width="5" height="76" rx="2" fill="#6366F1"/>
    <text x="582" y="146" font-size="13" font-weight="700" fill="#3730A3">1 · Stop-gradient</text>
    <text x="582" y="167" font-size="11.5" fill="#475569">The prediction target is detached - no gradient flows into it, so the</text>
    <text x="582" y="184" font-size="11.5" fill="#475569">network can't make target and prediction agree by collapsing both.</text>
  </g>
  <g>
    <rect x="560" y="208" width="560" height="76" rx="11" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="560" y="208" width="5" height="76" rx="2" fill="#0EA5E9"/>
    <text x="582" y="234" font-size="13" font-weight="700" fill="#075985">2 · EMA target encoder  (BYOL-style)</text>
    <text x="582" y="255" font-size="11.5" fill="#475569">A slow copy:  θ_target ← 0.99·θ_target + 0.01·θ.  A stable, slowly-moving</text>
    <text x="582" y="272" font-size="11.5" fill="#475569">target that the online encoder chases - avoids the trivial constant solution.</text>
  </g>
  <g>
    <rect x="560" y="296" width="560" height="92" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="560" y="296" width="5" height="92" rx="2" fill="#10B981"/>
    <text x="582" y="322" font-size="13" font-weight="700" fill="#065F46">3 · VICReg  (variance + covariance)</text>
    <text x="582" y="343" font-size="11.5" fill="#475569">Variance hinge:  mean(ReLU(1 − std(z)))  → forces each dim's std ≥ 1.</text>
    <text x="582" y="360" font-size="11.5" fill="#475569">Covariance term:  pushes off-diagonal cov → 0 → dims carry distinct info.</text>
    <text x="582" y="379" font-size="11.5" fill="#475569">This is the active force that keeps the cloud spread out.</text>
  </g>

  <text x="60" y="360" font-size="11.5" font-weight="600" fill="#334155">Loss couples them:</text>
  <rect x="60" y="372" width="440" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="80" y="398" font-size="12" font-weight="600" fill="#1E293B">L = 25·‖ŝ − sg(s_target)‖²</text>
  <text x="80" y="420" font-size="12" font-weight="600" fill="#10B981">    + 25·variance + 1·covariance   (VICReg)</text>
</svg>
